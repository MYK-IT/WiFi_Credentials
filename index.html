<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meeting Room Wi-Fi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .card {

            width: 420px;

            background: #ffffff;

            border-radius: 20px;

            padding: 30px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .logo {

            width: 140px;

            margin-bottom: 10px;
        }

        h1 {

            margin: 10px 0;

            color: #0f172a;

            font-size: 28px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 20px;
        }

        .qr {

            width: 250px;

            height: 250px;

            margin-bottom: 20px;
        }

        .info {

            background: #f3f4f6;

            border-radius: 12px;

            padding: 15px;

            text-align: left;

            font-size: 18px;
        }

        .row {

            margin-bottom: 12px;
        }

        .label {

            font-weight: bold;

            color: #1e293b;
        }

        .value {

            color: #111827;
        }

        button {

            margin-top: 15px;

            padding: 12px 20px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .support {

            margin-top: 20px;

            color: #555;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .card {

                width: 95%;
            }

            .qr {

                width: 220px;

                height: 220px;
            }
        }

    </style>

</head>

<body>

<div class="card">

    <img src="logo.png" class="logo">

    <h1 id="companyName">
        Company
    </h1>

    <div class="subtitle">

        Scan the QR code below to connect to Wi-Fi

    </div>

    <img id="wifiQR"
         class="qr">

    <div class="info">

        <div class="row">

            <span class="label">
                SSID:
            </span>

            <span class="value"
                  id="ssid">
            </span>

        </div>

        <div class="row">

            <span class="label">
                Password:
            </span>

            <span class="value"
                  id="password">
            </span>

        </div>

    </div>

    <button onclick="copyPassword()">

        Copy Password

    </button>

    <div class="support"
         id="support">

    </div>

</div>

<script>

fetch('wifi.json')

.then(response => response.json())

.then(data => {

    document.getElementById('companyName').innerText =
        data.company;

    document.getElementById('ssid').innerText =
        data.ssid;

    document.getElementById('password').innerText =
        data.password;

    document.getElementById('support').innerText =
        data.support;

    const wifiText =
        `WIFI:T:${data.security};S:${data.ssid};P:${data.password};;`;

    document.getElementById('wifiQR').src =
        'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' +
        encodeURIComponent(wifiText);

});

function copyPassword() {

    const password =
        document.getElementById('password').innerText;

    navigator.clipboard.writeText(password);

    alert('Password copied successfully.');

}

</script>

</body>

</html>
